# The Supabase origin (ADR-033).
#
# @supabase/supabase-js is given ONE base URL and appends /auth/v1, /rest/v1 and
# /storage/v1 to it. This maps those three prefixes onto the three containers so
# the existing client code — every server component, every Server Action — keeps
# working against a self-hosted stack with no change beyond the URL.
#
# It is a router and nothing more:
#   * it terminates no TLS (the Cloudflare tunnel does that at the edge);
#   * it enforces no authorization — that is RLS in the database, and a gateway
#     rule would be a second, weaker copy of it (CLAUDE.md §6);
#   * it holds no secrets. The anon and service-role keys pass through in the
#     caller's headers and are verified downstream by PostgREST and Storage
#     against JWT_SECRET.

server {
  listen 8000;
  server_name _;

  # §15.6 allows a 10 MB upload. nginx's default is 1 MB, which would reject a
  # site photo from any modern phone before it ever reached Storage.
  client_max_body_size 12m;

  # Uploads and report exports are slow on an office connection; the defaults
  # cut them off mid-transfer.
  proxy_connect_timeout 30s;
  proxy_send_timeout    120s;
  proxy_read_timeout    120s;

  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Connection        '';

  # Sign-in, sign-out, token refresh, password reset.
  location /auth/v1/ {
    proxy_pass http://auth:9999/;
  }

  # The data API. Every request carries the caller's JWT and runs as their role,
  # so row-level security applies exactly as it does on hosted Supabase.
  location /rest/v1/ {
    proxy_pass http://rest:3000/;
  }

  # File uploads and signed URLs.
  location /storage/v1/ {
    proxy_pass http://storage:5000/;
  }

  # The CRM itself, on the SAME origin as the three Supabase prefixes above.
  #
  # This is what lets PUBLIC_URL and NEXT_PUBLIC_SUPABASE_URL be one address —
  # `http://localhost` on the office LAN, `https://crm.<domain>` behind the
  # tunnel. Two hostnames would mean a second tunnel route and a cross-origin CSP
  # for no gain; the browser calls one origin and nginx decides which container
  # answers. The Supabase prefixes are matched first because they are longer.
  #
  # `app` is resolved through Docker's embedded DNS at request time rather than at
  # startup. A literal upstream is resolved once when nginx boots, so the gateway
  # would refuse to start whenever the application container was not already up —
  # and `app` depends on this gateway, so that ordering cannot be guaranteed. With
  # the resolver, a gateway that starts first simply answers 502 until the
  # application is listening, then recovers on its own.
  location / {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $app_upstream http://app:3000;
    proxy_pass $app_upstream;
  }
}
